<section class="jsk-frame jsk-bullets jsk-deco-{{ n % 3 }}" data-type="bullets">
  {% include "slides/_chrome.html" %}
  <div class="jsk-content" data-fit>
    {% if slide.title %}<h2 class="jsk-heading">{{ slide.title | br }}</h2>{% endif %}
    {% if slide.intro %}<p class="jsk-intro" data-shrink>{{ slide.intro | br }}</p>{% endif %}
    <ul class="jsk-items">
      {% for item in slide.items %}<li class="jsk-item" data-shrink><span class="jsk-dot"></span><span>{{ item | br }}</span></li>{% endfor %}
    </ul>
    {% if slide.note %}<p class="jsk-outro-note" data-shrink>{{ slide.note | br }}</p>{% endif %}
  </div>
</section>
