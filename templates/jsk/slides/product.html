<section class="jsk-frame jsk-s-{{ slideStyle }} jsk-product" data-type="product">
  {% include "slides/_chrome.html" %}
  <div class="jsk-content" data-fit>
    {% if slide.imageUrl %}<div class="jsk-product-img"><img src="{{ slide.imageUrl }}" alt=""></div>{% endif %}
    <h2 class="jsk-heading">{{ slide.name | br }}</h2>
    {% if slide.meta %}<p class="jsk-meta">{{ slide.meta }}</p>{% endif %}
    {% if slide.body %}<p class="jsk-body" data-shrink>{{ slide.body | br }}</p>{% endif %}
  </div>
</section>
